<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1060" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M2,2 L9,6 L2,10" fill="none" stroke="#6f7f9c" stroke-width="1.8"/>
    </marker>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,Menlo,monospace;}
      .btitle{font-weight:700;font-size:19px;}
      .sub{font-size:13px;fill:#93a0b8;}
      .code{font-size:12.5px;fill:#9fd0ac;}
      .lane{font-size:13px;font-weight:700;letter-spacing:2px;fill:#6b7a94;}
    </style>
  </defs>

  <rect width="760" height="1060" fill="#171f2e"/>

  <!-- title -->
  <text x="380" y="46" text-anchor="middle" fill="#eef2f8" font-size="24" font-weight="700">Bedrock Knowledge Base + OpenSearch</text>
  <text x="380" y="72" text-anchor="middle" fill="#93a0b8" font-size="14">The KB orchestrates. OpenSearch stores and searches the vectors.</text>

  <!-- ================= WRITE PATH ================= -->
  <line x1="80" y1="104" x2="200" y2="104" stroke="#38455f" stroke-width="1"/>
  <text x="212" y="109" class="lane">WRITE PATH — INGESTION (runs on KB sync)</text>

  <!-- W1 S3 -->
  <rect x="130" y="128" width="500" height="66" rx="9" fill="#232f47" stroke="#38455f" stroke-width="1.4"/>
  <text x="152" y="158" fill="#eef2f8" class="btitle">S3 documents</text>
  <text x="152" y="180" class="sub">deal memos, investor profiles, market reports</text>
  <text x="608" y="167" text-anchor="end" class="code mono">s3://dealgraph-documents</text>

  <line x1="380" y1="194" x2="380" y2="226" stroke="#6f7f9c" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- W2 KB chunk (amber) -->
  <rect x="130" y="228" width="500" height="82" rx="9" fill="#2a2418" stroke="#c78a2e" stroke-width="1.6"/>
  <text x="152" y="258" fill="#e0a852" class="btitle">Bedrock Knowledge Base</text>
  <text x="152" y="280" class="sub">splits each doc into chunks</text>
  <text x="152" y="299" class="code mono">HIERARCHICAL · 1500 / 300 tokens · 60 overlap</text>

  <line x1="380" y1="310" x2="380" y2="342" stroke="#6f7f9c" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- W3 Titan -->
  <rect x="130" y="344" width="500" height="72" rx="9" fill="#232f47" stroke="#38455f" stroke-width="1.4"/>
  <text x="152" y="372" fill="#eef2f8" class="btitle">Titan Embed v2</text>
  <text x="152" y="394" class="sub">turns each chunk of text into a vector (list of numbers)</text>
  <text x="608" y="381" text-anchor="end" class="code mono">embeddingModelArn</text>

  <line x1="380" y1="416" x2="380" y2="448" stroke="#6f7f9c" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="392" y="437" fill="#6f7f9c" font-size="12" class="mono">write vectors</text>

  <!-- W4 OpenSearch (green) -->
  <rect x="130" y="450" width="500" height="92" rx="9" fill="#1a2a22" stroke="#5c9d78" stroke-width="1.6"/>
  <text x="152" y="480" fill="#86c79a" class="btitle">OpenSearch Serverless</text>
  <text x="152" y="502" class="sub">the actual vector database — stores every chunk</text>
  <text x="152" y="522" class="code mono">index: dealgraph-index</text>
  <text x="152" y="538" class="code mono">embedding · content · metadata</text>

  <!-- ================= READ PATH ================= -->
  <line x1="80" y1="612" x2="200" y2="612" stroke="#38455f" stroke-width="1"/>
  <text x="212" y="617" class="lane">READ PATH — QUERY (runs on every question)</text>

  <!-- R1 user -->
  <rect x="130" y="636" width="500" height="62" rx="9" fill="#232f47" stroke="#38455f" stroke-width="1.4"/>
  <text x="152" y="664" fill="#eef2f8" class="btitle">User question</text>
  <text x="152" y="685" class="sub">"Which investors co-led Series B rounds in fintech?"</text>

  <line x1="380" y1="698" x2="380" y2="730" stroke="#6f7f9c" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- R2 Titan embed q -->
  <rect x="130" y="732" width="500" height="62" rx="9" fill="#232f47" stroke="#38455f" stroke-width="1.4"/>
  <text x="152" y="760" fill="#eef2f8" class="btitle">Titan Embed v2</text>
  <text x="152" y="781" class="sub">embeds the question with the same model used at write time</text>

  <line x1="380" y1="794" x2="380" y2="826" stroke="#6f7f9c" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="392" y="815" fill="#6f7f9c" font-size="12" class="mono">search by similarity</text>

  <!-- R3 OpenSearch search (green) -->
  <rect x="130" y="828" width="500" height="86" rx="9" fill="#1a2a22" stroke="#5c9d78" stroke-width="1.6"/>
  <text x="152" y="858" fill="#86c79a" class="btitle">OpenSearch Serverless</text>
  <text x="152" y="880" class="sub">k-NN / ANN search: finds the vectors nearest the question</text>
  <text x="152" y="900" class="code mono">→ returns top-k matching chunks (+ their text)</text>

  <line x1="380" y1="914" x2="380" y2="946" stroke="#6f7f9c" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="392" y="935" fill="#6f7f9c" font-size="12" class="mono">retrieved context</text>

  <!-- R4 Claude (amber) -->
  <rect x="130" y="948" width="500" height="82" rx="9" fill="#2a2418" stroke="#c78a2e" stroke-width="1.6"/>
  <text x="152" y="978" fill="#e0a852" class="btitle">Claude (via Bedrock)</text>
  <text x="152" y="1000" class="sub">writes the answer grounded ONLY in the retrieved chunks</text>
  <text x="152" y="1019" class="code mono">RAG: retrieval + generation</text>

  <!-- link note: same index -->
  <path d="M636 496 C 700 496, 700 871, 636 871" fill="none" stroke="#5c9d78" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="712" y="686" fill="#5c9d78" font-size="11.5" transform="rotate(90 712 686)" text-anchor="middle" class="mono">same index, written then searched</text>
</svg>
